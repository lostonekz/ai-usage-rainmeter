URL=[MeasureCodexJSON]
StringIndex=4
DynamicVariables=1

[MeasureCodexFiveHourDate]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCodexJSON]
StringIndex=5
DynamicVariables=1

[MeasureCodexSevenDayPercent]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCodexJSON]
StringIndex=6
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureCodexSevenDayCountdown]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCodexJSON]
StringIndex=7
DynamicVariables=1

[MeasureCodexSevenDayDate]
