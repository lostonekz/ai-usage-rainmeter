FontColor=#TextColorDim#
Text=Resets in
AntiAlias=1
DynamicVariables=1

[ResetCodexSevenDayCountdown]
Meter=String
MeasureName=MeasureCodexSevenDayCountdown
X=#GapSmall#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#HighlightColor#
Text=%1
AntiAlias=1
DynamicVariables=1

[ResetCodexSevenDayDate]
Meter=String
MeasureName=MeasureCodexSevenDayDate
X=#GapSmall#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#TextColorDim#
Text=%1
AntiAlias=1
DynamicVariables=1

; ============================================
; FOOTER
; ============================================
[DividerFooter]
Meter=Shape
X=#WidgetPadding#
Y=#SectionGap#R
Shape=Line 0,0,#BarWidth#,0 | Stroke Color #AccentColor# | StrokeWidth 1
DynamicVariables=1

; Leads the footer line so the timestamp has the full width to its right.
; Colour is driven by MeasureOverall; green / amber / red.
[StatusIndicator]
Meter=String
X=#WidgetPadding#
Y=#FooterGap#R
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#NormalColor#
Text=[\x25CF]
AntiAlias=1
DynamicVariables=1
ToolTipText=Claude: [MeasureStatus] | Codex: [MeasureCodexStatus]#CRLF##CRLF#[MeasureStatusMessage]

[LastUpdatedLabel]
Meter=String
X=#GapWide#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#TextColorDim#
Text=Updated:
AntiAlias=1
DynamicVariables=1

[LastUpdatedAgo]
Meter=String
MeasureName=MeasureHoursAgo
MeasureName2=MeasureMinsRemainder
MeasureName3=MeasureSecsRemainder
X=#GapWide#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#NormalColor#
Text=%1h %2m ago
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

; Format "ago" text based on time elapsed
; hours > 0: "Xh Ym ago", hours = 0 & mins > 0: "Xm Ys ago", else: "Xs ago"
[MeasureAgoFormat]
Measure=Calc
Formula=MeasureHoursAgo
IfCondition=(MeasureHoursAgo > 0)
IfTrueAction=[!SetOption LastUpdatedAgo Text "%1h %2m ago"][!UpdateMeter LastUpdatedAgo]
IfCondition2=(MeasureHoursAgo = 0) && (MeasureMinsRemainder > 0)
IfTrueAction2=[!SetOption LastUpdatedAgo Text "%2m %3s ago"][!UpdateMeter LastUpdatedAgo]
IfCondition3=(MeasureHoursAgo = 0) && (MeasureMinsRemainder = 0)
IfTrueAction3=[!SetOption LastUpdatedAgo Text "%3s ago"][!UpdateMeter LastUpdatedAgo]
DynamicVariables=1

[LastUpdatedDate]
Meter=String
MeasureName=MeasureLastUpdated
X=#GapMed#R
Y=0r
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#TextColorDim#
Text=%1
AntiAlias=1
DynamicVariables=1

; Says what broke, in plain words. Blank while both providers are healthy, so
; the line always occupies the same space and nothing below it shifts.
; Long messages are clipped here and shown in full on hover.
[ErrorBanner]
Meter=String
MeasureName=MeasureStatusMessage
X=#WidgetPadding#
Y=#TextGap#R
W=#BarWidth#
H=#ErrorBannerHeight#
FontFace=#FontFace#
FontSize=#FontSizeSmall#
FontColor=#CriticalColor#
Text=%1
ClipString=1
AntiAlias=1
DynamicVariables=1
ToolTipText=[MeasureStatusMessage]

; Color the "ago" text: green if within refresh interval, red if stale
[MeasureAgoColorCheck]
Measure=Calc
Formula=MeasureSecondsAgo
IfCondition=(MeasureSecondsAgo <= #RefreshInterval#)
IfTrueAction=[!SetOption LastUpdatedAgo FontColor #NormalColor#][!UpdateMeter LastUpdatedAgo][!Redraw]
IfCondition2=(MeasureSecondsAgo > #RefreshInterval#)
IfTrueAction2=[!SetOption LastUpdatedAgo FontColor #CriticalColor#][!UpdateMeter LastUpdatedAgo][!Redraw]
DynamicVariables=1
