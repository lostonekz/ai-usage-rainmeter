[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc
OnRefreshAction=[!CommandMeasure MeasureScript "Run"]

; Custom context menu for settings
ContextTitle=Refresh Interval
ContextAction=[!Log "Settings menu header"]
ContextTitle2=1 minute
ContextAction2=[!WriteKeyValue Variables RefreshInterval 60 "#@#Variables.inc"][!Refresh]
ContextTitle3=3 minutes
ContextAction3=[!WriteKeyValue Variables RefreshInterval 180 "#@#Variables.inc"][!Refresh]
ContextTitle4=5 minutes (default)
ContextAction4=[!WriteKeyValue Variables RefreshInterval 300 "#@#Variables.inc"][!Refresh]
ContextTitle5=10 minutes
ContextAction5=[!WriteKeyValue Variables RefreshInterval 600 "#@#Variables.inc"][!Refresh]
ContextTitle6=15 minutes
ContextAction6=[!WriteKeyValue Variables RefreshInterval 900 "#@#Variables.inc"][!Refresh]
ContextTitle7=30 minutes
ContextAction7=[!WriteKeyValue Variables RefreshInterval 1800 "#@#Variables.inc"][!Refresh]
ContextTitle8=-
ContextTitle9=Size 100%
ContextAction9=[!WriteKeyValue Variables Scale 1 "#@#Variables.inc"][!Refresh]
ContextTitle10=Size 150%
ContextAction10=[!WriteKeyValue Variables Scale 1.5 "#@#Variables.inc"][!Refresh]
ContextTitle11=Size 200%
ContextAction11=[!WriteKeyValue Variables Scale 2 "#@#Variables.inc"][!Refresh]
ContextTitle12=Size 250%
ContextAction12=[!WriteKeyValue Variables Scale 2.5 "#@#Variables.inc"][!Refresh]

; ============================================
; METADATA
; ============================================
[Metadata]
Name=Claude Usage Monitor
Author=JayDeeAU (Joe Demian @ Codemian)
Version=1.3.0
License=MIT
Information=Displays Claude.ai usage limits using OAuth credentials. Session + weekly totals, the currently metered scoped model, and a weekly surface breakdown.

; ============================================
; VARIABLES - Dynamic calculations
; ============================================
[Variables]
CurrentStatus=loading
FiveHourPercent=0
SevenDayPercent=0
ScopedPercent=0
LastUpdateTick=0

; ============================================
; SCRIPT EXECUTION
; ============================================
[MeasureScript]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#ScriptPath#"
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!CommandMeasure MeasureJSON "Update"][!CommandMeasure MeasureCodexJSON "Update"][!SetVariable LastUpdateTick [MeasureTotalTicks]][!Redraw]
DynamicVariables=1

; Trigger measure - counter that fires script when it wraps to 0
[MeasureRefreshTrigger]
Measure=Calc
Formula=(MeasureRefreshTrigger % #RefreshInterval#) + 1
IfCondition=(MeasureRefreshTrigger = #RefreshInterval#)
IfTrueAction=[!CommandMeasure MeasureScript "Run"]
DynamicVariables=1

; ============================================
; JSON PARSING
; ============================================
; Parent measure captures all values in one regex.
; JSON order: status, fiveHour{label,percent,share,resetCountdown,resetDate,...},
;             sevenDay{...}, scoped{...}, breakdown, lastUpdated, error
; Groups: 1=status
;         2=fiveHour.percent 3=fiveHour.resetCountdown 4=fiveHour.resetDate
;         5=sevenDay.percent 6=sevenDay.resetCountdown 7=sevenDay.resetDate
;         8=scoped.label 9=scoped.percent 10=scoped.share
;         11=scoped.resetCountdown 12=scoped.resetDate
;         13=breakdown 14=lastUpdated
[MeasureJSON]
Measure=Plugin
Plugin=WebParser
URL=file://%APPDATA%\ClaudeUsage\usage.json
RegExp=(?si)"status":\s*"([^"]*)".*?"fiveHour":\s*\{.*?"percent":\s*([-0-9.]+),.*?"resetCountdown":\s*"([^"]*)",\s*"resetDate":\s*"([^"]*)".*?"sevenDay":\s*\{.*?"percent":\s*([-0-9.]+),.*?"resetCountdown":\s*"([^"]*)",\s*"resetDate":\s*"([^"]*)".*?"scoped":\s*\{\s*"label":\s*"([^"]*)",\s*"percent":\s*([-0-9.]+),\s*"share":\s*"([^"]*)",\s*"resetCountdown":\s*"([^"]*)",\s*"resetDate":\s*"([^"]*)".*?"breakdown":\s*"([^"]*)".*?"lastUpdated":\s*"([^"]*)".*?"claudePlan":\s*"([^"]*)",\s*"overall":\s*"([^"]*)",\s*"statusMessage":\s*"([^"]*)"
UpdateRate=#RefreshInterval#
DynamicVariables=1

; Codex / ChatGPT block, parsed separately so neither provider's regex can latch
; onto the other's keys (both have "fiveHour"/"sevenDay"/"status").
; Groups: 1=status 2=plan
;         3=fiveHour.percent 4=fiveHour.resetCountdown 5=fiveHour.resetDate
;         6=sevenDay.percent 7=sevenDay.resetCountdown 8=sevenDay.resetDate
[MeasureCodexJSON]
Measure=Plugin
Plugin=WebParser
URL=file://%APPDATA%\ClaudeUsage\usage.json
RegExp=(?si)"codex":\s*\{\s*"status":\s*"([^"]*)",\s*"plan":\s*"([^"]*)".*?"fiveHour":\s*\{.*?"percent":\s*([-0-9.]+),.*?"resetCountdown":\s*"([^"]*)",\s*"resetDate":\s*"([^"]*)".*?"sevenDay":\s*\{.*?"percent":\s*([-0-9.]+),.*?"resetCountdown":\s*"([^"]*)",\s*"resetDate":\s*"([^"]*)"
UpdateRate=#RefreshInterval#
DynamicVariables=1

; Counter that increments every second (Update=1000 means each tick is 1 second)
[MeasureTotalTicks]
Measure=Calc
Formula=(MeasureTotalTicks + 1)

; Seconds since last script completion
[MeasureSecondsAgo]
Measure=Calc
Formula=(MeasureTotalTicks - #LastUpdateTick#)
DynamicVariables=1

[MeasureHoursAgo]
Measure=Calc
Formula=Floor(MeasureSecondsAgo / 3600)
DynamicVariables=1

[MeasureMinsRemainder]
Measure=Calc
Formula=Floor((MeasureSecondsAgo % 3600) / 60)
DynamicVariables=1

[MeasureSecsRemainder]
Measure=Calc
Formula=(MeasureSecondsAgo % 60)
DynamicVariables=1

; Status
[MeasureStatus]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=1
DynamicVariables=1

; Five Hour data
[MeasureFiveHourPercent]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=2
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureFiveHourCountdown]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=3
DynamicVariables=1

[MeasureFiveHourDate]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=4
DynamicVariables=1

; Seven Day data
[MeasureSevenDayPercent]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=5
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureSevenDayCountdown]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=6
DynamicVariables=1

[MeasureSevenDayDate]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=7
DynamicVariables=1

; Scoped model data - whichever model the plan currently meters separately
[MeasureScopedLabel]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=8
DynamicVariables=1

[MeasureScopedPercent]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=9
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureScopedShare]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=10
DynamicVariables=1

[MeasureScopedCountdown]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=11
DynamicVariables=1
IfMatch=^Not Metered$
IfMatchAction=[!SetOption ValueScoped Text ""][!SetOption ResetScopedLabel Text ""][!SetOption ResetScopedCountdown FontColor #NormalColor#][!UpdateMeter ValueScoped][!UpdateMeter ResetScopedLabel][!UpdateMeter ResetScopedCountdown][!Redraw]
IfNotMatchAction=[!SetOption ValueScoped Text "%1%"][!SetOption ResetScopedLabel Text "Resets in"][!SetOption ResetScopedCountdown FontColor #HighlightColor#][!UpdateMeter ValueScoped][!UpdateMeter ResetScopedLabel][!UpdateMeter ResetScopedCountdown][!Redraw]

[MeasureScopedDate]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=12
DynamicVariables=1

; Weekly breakdown by surface
[MeasureBreakdown]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=13
DynamicVariables=1

; Last Updated
[MeasureLastUpdated]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=14
DynamicVariables=1

; Plan tier, read from the local credentials file rather than the usage API
[MeasureClaudePlan]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=15
DynamicVariables=1

; ok = both providers answered, degraded = one is down, error = neither
[MeasureOverall]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=16
DynamicVariables=1
IfMatch=^ok$
IfMatchAction=[!SetOption StatusIndicator FontColor #NormalColor#][!SetOption ErrorBanner FontColor #TextColorDim#][!UpdateMeter StatusIndicator][!UpdateMeter ErrorBanner][!Redraw]
IfMatch2=^degraded$
IfMatchAction2=[!SetOption StatusIndicator FontColor #WarningColor#][!SetOption ErrorBanner FontColor #WarningColor#][!UpdateMeter StatusIndicator][!UpdateMeter ErrorBanner][!Redraw]
IfMatch3=^error$
IfMatchAction3=[!SetOption StatusIndicator FontColor #CriticalColor#][!SetOption ErrorBanner FontColor #CriticalColor#][!UpdateMeter StatusIndicator][!UpdateMeter ErrorBanner][!Redraw]

; Empty while healthy, so the line costs nothing but never shifts the layout
[MeasureStatusMessage]
Measure=Plugin
Plugin=WebParser
URL=[MeasureJSON]
StringIndex=17
DynamicVariables=1

; ============================================
; CODEX / CHATGPT DATA
; ============================================
[MeasureCodexStatus]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCodexJSON]
StringIndex=1
DynamicVariables=1

[MeasureCodexPlan]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCodexJSON]
StringIndex=2
DynamicVariables=1

[MeasureCodexFiveHourPercent]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCodexJSON]
StringIndex=3
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureCodexFiveHourCountdown]
