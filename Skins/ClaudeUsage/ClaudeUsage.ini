DynamicVariables=1

; ============================================
; COLOR CALCULATIONS
; ============================================
[MeasureFiveHourColor]
Measure=Calc
Formula=MeasureFiveHourPercent
IfCondition=(MeasureFiveHourPercent >= #CriticalThreshold#)
IfTrueAction=[!SetOption BarFiveHour BarColor #BarCriticalColor#]
IfCondition2=(MeasureFiveHourPercent >= #WarningThreshold#) && (MeasureFiveHourPercent < #CriticalThreshold#)
IfTrueAction2=[!SetOption BarFiveHour BarColor #BarWarningColor#]
IfCondition3=(MeasureFiveHourPercent < #WarningThreshold#)
IfTrueAction3=[!SetOption BarFiveHour BarColor #BarNormalColor#]
DynamicVariables=1

[MeasureSevenDayColor]
Measure=Calc
Formula=MeasureSevenDayPercent
IfCondition=(MeasureSevenDayPercent >= #CriticalThreshold#)
IfTrueAction=[!SetOption BarSevenDay BarColor #BarCriticalColor#]
IfCondition2=(MeasureSevenDayPercent >= #WarningThreshold#) && (MeasureSevenDayPercent < #CriticalThreshold#)
IfTrueAction2=[!SetOption BarSevenDay BarColor #BarWarningColor#]
IfCondition3=(MeasureSevenDayPercent < #WarningThreshold#)
IfTrueAction3=[!SetOption BarSevenDay BarColor #BarNormalColor#]
DynamicVariables=1

[MeasureScopedColor]
Measure=Calc
Formula=MeasureScopedPercent
IfCondition=(MeasureScopedPercent >= #CriticalThreshold#)
IfTrueAction=[!SetOption BarScoped BarColor #BarCriticalColor#]
IfCondition2=(MeasureScopedPercent >= #WarningThreshold#) && (MeasureScopedPercent < #CriticalThreshold#)
IfTrueAction2=[!SetOption BarScoped BarColor #BarWarningColor#]
IfCondition3=(MeasureScopedPercent < #WarningThreshold#)
IfTrueAction3=[!SetOption BarScoped BarColor #BarScopedColor#]
DynamicVariables=1

[MeasureCodexFiveHourColor]
Measure=Calc
Formula=MeasureCodexFiveHourPercent
IfCondition=(MeasureCodexFiveHourPercent >= #CriticalThreshold#)
IfTrueAction=[!SetOption BarCodexFiveHour BarColor #BarCriticalColor#]
IfCondition2=(MeasureCodexFiveHourPercent >= #WarningThreshold#) && (MeasureCodexFiveHourPercent < #CriticalThreshold#)
IfTrueAction2=[!SetOption BarCodexFiveHour BarColor #BarWarningColor#]
IfCondition3=(MeasureCodexFiveHourPercent < #WarningThreshold#)
IfTrueAction3=[!SetOption BarCodexFiveHour BarColor #BarCodexColor#]
DynamicVariables=1

[MeasureCodexSevenDayColor]
Measure=Calc
Formula=MeasureCodexSevenDayPercent
IfCondition=(MeasureCodexSevenDayPercent >= #CriticalThreshold#)
IfTrueAction=[!SetOption BarCodexSevenDay BarColor #BarCriticalColor#]
IfCondition2=(MeasureCodexSevenDayPercent >= #WarningThreshold#) && (MeasureCodexSevenDayPercent < #CriticalThreshold#)
IfTrueAction2=[!SetOption BarCodexSevenDay BarColor #BarWarningColor#]
IfCondition3=(MeasureCodexSevenDayPercent < #WarningThreshold#)
IfTrueAction3=[!SetOption BarCodexSevenDay BarColor #BarCodexColor#]
DynamicVariables=1

