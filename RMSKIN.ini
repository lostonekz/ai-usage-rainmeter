[rmskin]
Name=AI Usage Monitor
Author=JayDeeAU (Joe Demian @ Codemian)
Version=1.3.0
License=Not open source - fork of JayDeeAU's all-rights-reserved work; see LICENSE
Information=Claude and Codex/ChatGPT usage in one widget. Claude: 5-hour session, 7-day all models, the currently metered scoped model with its share of the weekly allowance, and a weekly breakdown by surface. Codex: plan type plus the 5-hour and 7-day windows. Plan tier badges, on-skin error reporting, and a Scale variable for widget size. Each provider is fetched independently, so one failing does not blank the other.
MinimumRainmeter=4.5.0
MinimumWindows=10
LoadType=Skin
Load=ClaudeUsage\ClaudeUsage.ini
